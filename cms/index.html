    </div>

<script src="../js/sanity.config.js?v=20261022c"></script>
<script>
  var cfg = window.TKA_SANITY || {};
  var panel = document.getElementById("panel");
  if (cfg.projectId && cfg.studioUrl) {
    panel.innerHTML = '<a class="button" href="' + cfg.studioUrl + '">Otvori urednik</a>';
  } else {
    panel.innerHTML = '<p>Nalog na Sanity još nije povezan sa sajtom.</p><a class="button" href="https://www.sanity.io/manage">Otvori Sanity</a>';
  }
</script>
